services:
  - type: web
    name: grow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MARKET_DATA_PROVIDER
        value: free
      - key: NEWS_PROVIDER
        value: free
      - key: AWS_REGION
        value: ap-south-1
      - key: BEDROCK_MODEL_ID
        value: anthropic.claude-opus-5-20260724-v1:0
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: grow-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
